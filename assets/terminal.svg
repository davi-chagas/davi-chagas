
<svg xmlns="http://www.w3.org/2000/svg" width="960" height="340" viewBox="0 0 960 340" role="img" aria-labelledby="title desc">
  <title id="title">Davi Chagas | System Analysis and Development Student</title>
  <desc id="desc">Terminal-style profile banner presenting Davi Chagas, his academic background and projects.</desc>

  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#192230" stroke-width="0.5"/>
    </pattern>

    <clipPath id="reveal">
      <rect x="34" y="174" width="890" height="110">
        <animate
          attributeName="width"
          values="0;890;890"
          keyTimes="0;0.25;1"
          dur="12s"
          repeatCount="indefinite"
        />
      </rect>
    </clipPath>

    <style>
      text {
        font-family: Consolas, 'Liberation Mono', monospace;
      }

      .muted {
        fill: #94a3b8;
      }

      .accent {
        fill: #5eead4;
      }

      @media (prefers-reduced-motion: reduce) {
        .animated {
          display: none;
        }

        .output {
          clip-path: none;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect x="1" y="1" width="958" height="338" rx="12"
        fill="#0d1117" stroke="#303b4b"/>

  <rect x="2" y="43" width="956" height="280" fill="url(#grid)"/>

  <!-- Terminal header -->
  <path d="M1 43H959" stroke="#303b4b"/>

  <circle cx="24" cy="23" r="5" fill="#fb7185"/>
  <circle cx="43" cy="23" r="5" fill="#fbbf24"/>
  <circle cx="62" cy="23" r="5" fill="#5eead4"/>

  <text x="480" y="28" text-anchor="middle"
        font-size="12" class="muted">
    davi-chagas / workspace
  </text>

  <!-- User information -->
  <text x="34" y="84" font-size="15">
    <tspan class="accent">davi-chagas@github</tspan>
    <tspan class="muted">:~ $ whoami</tspan>
  </text>

  <text x="32" y="133" font-size="38"
        font-weight="700" fill="#f1f5f9" letter-spacing="-1">
    Davi Chagas
  </text>

  <text x="34" y="161" font-size="15" class="muted">
    System Analysis and Development Student
  </text>

  <!-- Projects -->
  <g class="output" clip-path="url(#reveal)" font-size="14">

    <text x="34" y="200" class="muted">
      $ ls projects/
    </text>

    <text x="34" y="231">
      <tspan class="accent">[running]</tspan>
      <tspan fill="#e2e8f0"> SafeMeat</tspan>
      <tspan class="muted"> — Cold chain monitoring</tspan>
    </text>

    <text x="34" y="262">
      <tspan class="accent">[running]</tspan>
      <tspan fill="#e2e8f0"> YUME</tspan>
      <tspan class="muted"> — Anime and manga platform</tspan>
    </text>

  </g>

  <!-- Terminal cursor -->
  <text x="34" y="310" font-size="15" class="accent">$</text>

  <rect class="animated" x="53" y="297" width="9" height="17"
        fill="#5eead4">
    <animate
      attributeName="opacity"
      values="1;0;1"
      dur="1.2s"
      calcMode="discrete"
      repeatCount="indefinite"
    />
  </rect>

  <!-- Footer -->
  <text x="924" y="310" text-anchor="end"
        font-size="11" class="muted">
    DAVI-CHAGAS / DEV
  </text>

</svg>
